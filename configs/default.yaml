materials:
  r: 7.0e-7          # 粒径半径 (m)
  rho: 2650          # 密度 (kg/m^3)
  E: 5.0e10          # 杨氏模量 (Pa)
  nu: 0.3            # 泊松比
  gamma: 0.25        # 表面能 (J/m^2)
  MU_S: 0.5          # 静摩擦系数
  MU_K: 0.5          # 动摩擦系数
  e_n: 0.6          # 法向恢复系数 e_n (0<e_n<1)，Tsuji 阻尼公式用
  mu_r: 0.5       # 滚动摩擦系数 (相对 Fn)
  c_rot: 0     # 旋转黏滞 (N·m·s)

initialization:
  N: 30              # 网格边长，生成 N×N 个区域
  h: 35.0e-7          # 相邻网格中心距 (m)
  vmin: 0.0          # 初速度幅值下限 (m/s)
  vmax: 4.0          # 初速度幅值上限 (m/s)
  seed: 6            # 随机种子

simulation:
  dt: 2.5e-10        # 时间步 (s)
  t_end: 30e-5      # 总时长 (s)
  skin_factor: 0.2   # 邻域skin厚度占 r 的比例 (r_cut=2r+skin)
  snapshot_interval: 1e-6   # 快照间隔 (s)
  save_stride: 1     # 报告步长：每步都写或按 stride 写
  snapshot_dir: "data/30_small_t_30e-5_seed6_1"  # 默认不开启并行
  snapshot_show_velocity: false  # 快照是否绘制速度信息（速度箭头 + 最快颗粒标注）
  snapshot_show_dt_factor: true  # 快照左下角是否显示当前步长倍率
  domain_scale: 1.0  # 盒子大小相对 N*h 的缩放 (1.0 表示 L=N*h)
  use_numba: true    # 是否启用 Numba 加速
  use_numba_parallel: false  # 是否启用 Numba 多线程并行（prange）
  use_cpp: false      # 是否启用 C++ pybind11 内核（需先构建并安装）
  use_neighbor_cache: true  # 是否启用邻域缓存（Verlet 邻居）
  use_jkr_interp: true      # 是否用插值法近似 JKR 法向力（替代牛顿迭代）
  jkr_interp_points: 512     # JKR 插值表点数（越大越精细，开销越高）
  jkr_interp_alpha_factor: 5.0  # 插值上界因子：alpha_max = factor * a0
  # ---------- 自适应时间步长（按全局最大速度分档） ----------
  adaptive_timestep: true
  adaptive_dt_factors: [1, 5, 10, 20, 50]  # 对应基准步长 T 的放大倍数
  adaptive_vmax_ratio_thresholds: [0.2, 0.1, 0.05, 0.02]  # 触发 5T/10T/20T/50T 的 vmax/vmax0 阈值

output:
  plot: false
  report: true
