materials:
  r: 7.0e-7          # 粒径半径 (m)
  rho: 2650          # 密度 (kg/m^3)
  E: 5.0e10          # 杨氏模量 (Pa)
  nu: 0.3            # 泊松比
  gamma: 0.25        # 表面能 (J/m^2)
  MU_S: 0.5          # 静摩擦系数
  MU_K: 0.5          # 动摩擦系数
  e_n: 0.6           # 法向恢复系数 e_n (0<e_n<1)，Tsuji 阻尼公式用
  mu_r: 0.5          # 滚动摩擦系数 (相对 Fn)
  c_rot: 0           # 旋转黏滞 (N·m·s)

# 该配置文件主要用于 scripts/run_cluster_collision.py，
# initialization 段对该脚本没有影响，仅保留以便兼容其它脚本。
initialization:
  N: 10              # 网格边长（占位参数）
  h: 35.0e-7         # 相邻网格中心距 (m)
  vmin: 0.0          # 初速度幅值下限 (m/s)
  vmax: 4.0          # 初速度幅值上限 (m/s)
  seed: 6            # 随机种子

simulation:
  dt: 1e-10        # 时间步 (s)
  t_end: 1.0e-4      # 总时长 (s)
  skin_factor: 0.2   # 邻域skin厚度占 r 的比例 (r_cut=2r+skin)
  snapshot_interval: 1.0e-6   # 快照间隔 (s)
  save_stride: 1     # 报告步长：每步都写或按 stride 写
  snapshot_dir: "data/cluster_collision"  # 团簇碰撞专用输出目录
  snapshot_show_velocity: false  # 快照是否绘制速度信息
  domain_scale: 1.0  # 盒子大小相对 N*h 的缩放（对本脚本影响较小）
  use_numba: true    # 是否启用 Numba 加速
  use_numba_parallel: false  # 是否启用 Numba 多线程并行（prange）
  use_cpp: false      # 是否启用 C++ pybind11 内核（需先构建并安装）
  use_neighbor_cache: true  # 是否启用邻域缓存（Verlet 邻居）
  use_jkr_interp: true      # 是否用插值法近似 JKR 法向力（替代牛顿迭代）
  jkr_interp_points: 512    # JKR 插值表点数
  jkr_interp_alpha_factor: 5.0  # 插值上界因子：alpha_max = factor * a0
  # ---------- 自适应时间步长（含团簇刚体化） ----------
  adaptive_timestep: false    # 对 run_cluster_collision.py 默认关闭自适应步长
  dt_large_factor: 100       # 稳定态步长放大倍数
  vn_threshold: 1e-3          # 法向相对速度阈值 (m/s)
  stable_steps_required: 50   # 连续满足稳定条件的步数
  approach_time_factor: 2.0   # 接近时间安全系数

output:
  plot: false
  report: true

cluster:
  # 团簇 A/B 的颗粒数
  N1: 1
  N2: 1
  # 控制两团簇内部结构的随机种子（同一 seed 可复现）
  seed: 15
  # 初始 A/B 团簇之间的间隙，单位为颗粒半径倍数
  gap_factor: 2.9
  # 团簇结构参数 z_target：目标平均配位数（每个颗粒的平均相邻颗粒数）
  #   约 2 表示接近树状/链状结构（较松散）；
  #   更高的取值（例如 3~4）表示更致密、邻居更多；
  #   实际平均配位数会在生成过程中尽量贴近该目标值。
  z_target: 2.6
  # B 团簇质心初始速度分量（A 初始静止在原点）
  vxB: -0.5
  vyB: 0.0
  # 仅在 N1=N2=1 时使用的两颗粒黏附判据参数
  adhesion_vn_thresh: 1.0e-4   # 法向相对速度阈值 (m/s)
  adhesion_steps: 50           # 连续低于阈值的步数判黏附
  # --------- 速度扫描与热力图配置（仅在 N1=N2=1 且 scan_enabled=true 时生效） ---------
  scan_enabled: false          # 开关：true 时进行 (|Vx|, Vy) 扫描并输出热力图
  vx_min: 0.0                  # |Vx| 扫描下限 (m/s)
  vx_max: 4.0                  # |Vx| 扫描上限 (m/s)
  vx_steps: 50                 # |Vx| 方向采样点数
  vy_min: 0.0                  # Vy 扫描下限 (m/s)
  vy_max: 4.0                  # Vy 扫描上限 (m/s)
  vy_steps: 50                 # Vy 方向采样点数
  heatmap_filename: "vn_heatmap3.png"   # 热力图文件名（保存在 simulation.snapshot_dir 下）
  # --------- 法向速度-表面能扫描（仅在 N1=N2=1 且 vn_gamma_scan_enabled=true 时生效） ---------
  vn_gamma_scan_enabled: true   # 开关：true 时在 (Vn, gamma) 网格上扫描
  vn_min: 0.0                    # 法向入射速度 Vn 扫描下限 (m/s)
  vn_max: 5.0                    # 法向入射速度 Vn 扫描上限 (m/s)
  vn_steps: 51                   # Vn 方向采样点数
  gamma_min: 0.00                # 表面能 gamma 扫描下限 (J/m^2)
  gamma_max: 0.50                # 表面能 gamma 扫描上限 (J/m^2)
  gamma_steps: 51                # gamma 方向采样点数
  vn_gamma_heatmap_filename: "vn_gamma_heatmap.png"  # (Vn, gamma) 热力图文件名
